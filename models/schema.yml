version: 2

models:
  - name: gold_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: gold_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: gold_sales
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_customers')
                field: customer_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_products')
                field: product_id

      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Delivered
                  - Cancelled
                  - Returned
                  - Shipped
                  - Processing
